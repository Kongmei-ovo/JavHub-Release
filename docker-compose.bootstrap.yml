name: javhub

x-project-dir: &project-dir "/absolute/path/to/JavHub-Release"

# Install only the independent gateway, then open http://HOST:3000.
# The gateway creates the selected services within this same project.
services:
  updater:
    image: ${JAVHUB_UPDATER_IMAGE:-ghcr.io/kongmei-ovo/javhub-updater:stable}
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-javhub}
      JAVHUB_COMPOSE_FILES: docker-compose.bootstrap.yml
      JAVHUB_MANAGED_DEPLOYMENT: "true"
      JAVHUB_PROJECT_DIR: *project-dir
      JAVHUB_RELEASE_URL: https://www.javhub.quest/api/v1/release
      JAVHUB_UPSTREAM_URL: http://javhub:80
      JAVHUB_UPDATE_CHECK_INTERVAL: 60s
      JAVHUB_UPDATE_TIMEOUT: 30m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: *project-dir
        target: *project-dir
        read_only: false
    working_dir: *project-dir
    ports:
      - "${JAVHUB_PORT:-3000}:8080"
      - "${JAVHUB_MEDIA_PORT:-18090}:8080"
    healthcheck:
      test: [CMD, wget, -qO-, "http://127.0.0.1:8080/_updater/health"]
      interval: 30s
      timeout: 5s
      retries: 3
